<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GDQP&AN 11</title><style>body{font-family:system-ui,Arial,sans-serif;background:#eef4f8;color:#132c40;margin:0}header{background:#115a75;color:white;padding:20px}main{max-width:900px;margin:auto;padding:16px}.panel{background:white;border-radius:14px;padding:20px;margin:15px 0;box-shadow:0 3px 14px #1232}button,select{padding:10px 13px;border-radius:9px;border:1px solid #a7bbc7;background:white;font-size:16px;cursor:pointer}button.primary{background:#096b88;color:white}.opt{display:block;width:100%;text-align:left;margin:9px 0}.good{background:#c9f3d7!important}.bad{background:#ffd1d1!important}.muted{color:#60798b}#timer{font-weight:bold} .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center} @media(max-width:600px){.panel{padding:14px}button,select{max-width:100%}}</style></head><body><div style="background:#fff3cd;color:#664d03;padding:12px 16px;font:600 14px Arial,sans-serif;text-align:center;border-bottom:2px solid #e6b95d">BẢN ÔN TẬP THỬ NGHIỆM — 50 câu chưa hoàn tất đối chiếu và kiểm định đáp án với SGK. Không sử dụng làm đề kiểm tra chính thức.</div><header><h2>Ôn tập GDQP&AN lớp 11</h2><div>Bản 50 câu – cần phản biện chuyên môn cuối</div></header><main><section class="panel"><div class="toolbar"><label>Bài <select id="lesson"><option value="all">Tất cả</option></select></label><label>Số câu <select id="size"><option>10</option><option>20</option><option>50</option><option>100</option></select></label><button class="primary" onclick="start(false)">Luyện tập</button><button onclick="start(true)">Thi thử 20 phút</button><button onclick="retryWrong()">Luyện câu sai</button><button onclick="showStats()">Thống kê</button></div><p id="status" class="muted"></p></section><section class="panel" id="quiz">Chọn chế độ để bắt đầu.</section></main><script>const DATA=[{"id": 1, "grade": 11, "lesson": 1, "question": "Một mục tiêu của chiến lược bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa trong tình hình mới là gì?", "options": {"A": "Bảo vệ vững chắc độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ của Tổ quốc", "B": "Chỉ bảo vệ vùng đất liền", "C": "Chỉ tăng cường hoạt động thương mại", "D": "Chỉ tập trung phát triển kinh tế đối ngoại"}, "answer": "A", "level": "Nhận biết", "page": 5, "reference": "I.1. Mục tiêu"}, {"id": 2, "grade": 11, "lesson": 1, "question": "Theo SGK, việc giữ vững sự lãnh đạo của Đảng trong bảo vệ Tổ quốc được xác định như thế nào?", "options": {"A": "Giữ vững sự lãnh đạo trực tiếp, tuyệt đối về mọi mặt của Đảng", "B": "Chỉ lãnh đạo trong thời bình", "C": "Chuyển toàn bộ trách nhiệm cho một tổ chức xã hội", "D": "Chỉ lãnh đạo về kinh tế"}, "answer": "A", "level": "Vận dụng", "page": 5, "reference": "I.2. Quan điểm"}, {"id": 3, "grade": 11, "lesson": 1, "question": "Chủ quyền lãnh thổ quốc gia được SGK mô tả là quyền như thế nào?", "options": {"A": "Chỉ áp dụng với đất liền", "B": "Tạm thời đối với một phần lãnh thổ", "C": "Do mọi quốc gia khác cùng quyết định", "D": "Tuyệt đối, đầy đủ và riêng biệt của quốc gia đối với lãnh thổ"}, "answer": "D", "level": "Nhận biết", "page": 6, "reference": "II.1. Chủ quyền lãnh thổ"}, {"id": 4, "grade": 11, "lesson": 1, "question": "Theo SGK, biên giới quốc gia của Việt Nam bao gồm biên giới trên đất liền và các khu vực nào?", "options": {"A": "Chỉ trên biển và trên sông", "B": "Chỉ trên không và trên sông", "C": "Chỉ tại các cửa khẩu", "D": "Trên biển, trong lòng đất và trên không"}, "answer": "D", "level": "Nhận biết", "page": 6, "reference": "II.2. Biên giới quốc gia"}, {"id": 5, "grade": 11, "lesson": 1, "question": "Khu vực biên giới trên đất liền gồm đơn vị hành chính cấp xã nào?", "options": {"A": "Mọi xã thuộc tỉnh có biên giới", "B": "Chỉ các phường thuộc thành phố", "C": "Xã, phường, thị trấn có một phần địa giới hành chính trùng hợp với biên giới quốc gia", "D": "Mọi thị trấn trên cả nước"}, "answer": "C", "level": "Nhận biết", "page": 7, "reference": "II.3. Khu vực biên giới"}, {"id": 6, "grade": 11, "lesson": 1, "question": "Một người cố ý làm hư hỏng mốc quốc giới. Theo SGK, hành vi đó thuộc nhóm nào?", "options": {"A": "Hoạt động bảo vệ biên giới", "B": "Hoạt động được khuyến khích", "C": "Hoạt động không liên quan đến biên giới", "D": "Hành vi bị nghiêm cấm"}, "answer": "D", "level": "Vận dụng cao", "page": 7, "reference": "II.4. Các hành vi bị nghiêm cấm"}, {"id": 7, "grade": 11, "lesson": 1, "question": "Công ước của Liên hợp quốc về Luật Biển năm 1982 được SGK viết tắt là gì?", "options": {"A": "UNCLOS 1982", "B": "WHO 1982", "C": "ASEAN 1982", "D": "UNESCO 1982"}, "answer": "A", "level": "Nhận biết", "page": 8, "reference": "III.1. Công ước Luật Biển 1982"}, {"id": 8, "grade": 11, "lesson": 1, "question": "Theo SGK, lãnh hải Việt Nam rộng bao nhiêu hải lí tính từ đường cơ sở?", "options": {"A": "24 hải lí", "B": "200 hải lí", "C": "12 hải lí", "D": "6 hải lí"}, "answer": "C", "level": "Nhận biết", "page": 9, "reference": "III.2. Luật Biển Việt Nam"}, {"id": 9, "grade": 11, "lesson": 1, "question": "Theo SGK, vùng tiếp giáp lãnh hải rộng bao nhiêu hải lí tính từ ranh giới ngoài của lãnh hải?", "options": {"A": "24 hải lí", "B": "12 hải lí", "C": "6 hải lí", "D": "200 hải lí"}, "answer": "B", "level": "Nhận biết", "page": 9, "reference": "III.2. Luật Biển Việt Nam"}, {"id": 10, "grade": 11, "lesson": 1, "question": "Theo SGK, vùng đặc quyền kinh tế có chiều rộng bao nhiêu hải lí tính từ đường cơ sở?", "options": {"A": "24 hải lí", "B": "200 hải lí", "C": "350 hải lí", "D": "12 hải lí"}, "answer": "B", "level": "Nhận biết", "page": 9, "reference": "III.2. Luật Biển Việt Nam"}, {"id": 11, "grade": 11, "lesson": 1, "question": "Khi phát hiện hành vi vi phạm chủ quyền lãnh thổ, biên giới quốc gia, học sinh cần làm gì?", "options": {"A": "Kịp thời báo cho nhà trường, chính quyền địa phương hoặc lực lượng chức năng gần nhất", "B": "Đăng tin chưa kiểm chứng để thu hút chú ý", "C": "Bỏ qua vì không liên quan", "D": "Tự ý đối đầu bằng bạo lực"}, "answer": "A", "level": "Vận dụng", "page": 10, "reference": "IV.2. Trách nhiệm của học sinh"}, {"id": 12, "grade": 11, "lesson": 2, "question": "Theo SGK, nghĩa vụ quân sự là nghĩa vụ vẻ vang của công dân phục vụ trong lực lượng nào?", "options": {"A": "Chỉ trong lực lượng dân phòng", "B": "Quân đội nhân dân", "C": "Chỉ trong tổ chức thanh niên", "D": "Chỉ trong các doanh nghiệp"}, "answer": "B", "level": "Nhận biết", "page": 11, "reference": "I.1. Nghĩa vụ quân sự của công dân"}, {"id": 13, "grade": 11, "lesson": 2, "question": "Theo SGK, công dân nam đủ bao nhiêu tuổi trở lên phải đăng kí nghĩa vụ quân sự?", "options": {"A": "15 tuổi", "B": "16 tuổi", "C": "20 tuổi", "D": "17 tuổi"}, "answer": "D", "level": "Nhận biết", "page": 12, "reference": "I.2. Đăng kí nghĩa vụ quân sự"}, {"id": 14, "grade": 11, "lesson": 2, "question": "Theo SGK, công dân nữ đủ bao nhiêu tuổi trở lên có ngành, nghề chuyên môn phù hợp được đăng kí nghĩa vụ quân sự?", "options": {"A": "16 tuổi", "B": "21 tuổi", "C": "18 tuổi", "D": "17 tuổi"}, "answer": "C", "level": "Nhận biết", "page": 12, "reference": "I.2. Đăng kí nghĩa vụ quân sự"}, {"id": 15, "grade": 11, "lesson": 2, "question": "Theo SGK, độ tuổi gọi nhập ngũ thông thường của công dân là khoảng nào?", "options": {"A": "Từ đủ 16 tuổi đến hết 20 tuổi", "B": "Từ đủ 18 tuổi đến hết 25 tuổi", "C": "Từ đủ 17 tuổi đến hết 22 tuổi", "D": "Từ đủ 20 tuổi đến hết 30 tuổi"}, "answer": "B", "level": "Nhận biết", "page": 13, "reference": "I.3. Nhập ngũ"}, {"id": 16, "grade": 11, "lesson": 2, "question": "Theo SGK, thời hạn phục vụ tại ngũ trong thời bình của hạ sĩ quan, binh sĩ là bao nhiêu tháng?", "options": {"A": "12 tháng", "B": "36 tháng", "C": "24 tháng", "D": "18 tháng"}, "answer": "C", "level": "Nhận biết", "page": 13, "reference": "I.3. Nhập ngũ"}, {"id": 17, "grade": 11, "lesson": 2, "question": "Một công dân cố ý trốn tránh thực hiện nghĩa vụ quân sự. Theo SGK, hành vi này được xác định ra sao?", "options": {"A": "Là hành vi được khuyến khích", "B": "Là hành vi bị nghiêm cấm", "C": "Là quyền lựa chọn cá nhân", "D": "Không thuộc phạm vi nghĩa vụ quân sự"}, "answer": "B", "level": "Vận dụng", "page": 14, "reference": "I.5. Các hành vi bị nghiêm cấm"}, {"id": 18, "grade": 11, "lesson": 2, "question": "Theo SGK, công dân có trách nhiệm như thế nào khi nhận lệnh gọi khám sức khỏe nghĩa vụ quân sự?", "options": {"A": "Tự chọn địa điểm khám khác", "B": "Chỉ cần báo với bạn bè", "C": "Có thể bỏ qua mà không thông báo", "D": "Có mặt đúng thời gian, địa điểm ghi trong lệnh"}, "answer": "D", "level": "Vận dụng", "page": 17, "reference": "III.1. Trách nhiệm của công dân"}, {"id": 19, "grade": 11, "lesson": 2, "question": "Học sinh muốn tìm hiểu nghĩa vụ quân sự phù hợp với trách nhiệm nêu trong SGK nên làm gì?", "options": {"A": "Tự ý sửa nội dung quy định", "B": "Khuyên bạn bè tránh tìm hiểu", "C": "Chủ động học tập, tìm hiểu và tuyên truyền đúng quy định", "D": "Chia sẻ tin đồn chưa kiểm chứng"}, "answer": "C", "level": "Vận dụng", "page": 18, "reference": "III.2. Trách nhiệm của học sinh"}, {"id": 20, "grade": 11, "lesson": 3, "question": "Theo SGK, tội phạm là hành vi nguy hiểm cho xã hội được quy định trong văn bản nào?", "options": {"A": "Nội quy lớp học", "B": "Bộ luật Hình sự", "C": "Quy chế thư viện", "D": "Điều lệ câu lạc bộ"}, "answer": "B", "level": "Nhận biết", "page": 19, "reference": "I.1. Khái niệm tội phạm"}, {"id": 21, "grade": 11, "lesson": 3, "question": "Tội phạm sử dụng công nghệ cao theo SGK sử dụng phương tiện chủ yếu nào để thực hiện hành vi?", "options": {"A": "Chỉ phương tiện thô sơ", "B": "Chỉ tài liệu giấy", "C": "Chỉ dụng cụ thể thao", "D": "Công nghệ cao trong môi trường mạng và thiết bị điện tử"}, "answer": "D", "level": "Nhận biết", "page": 20, "reference": "II.1. Khái niệm tội phạm sử dụng công nghệ cao"}, {"id": 22, "grade": 11, "lesson": 3, "question": "Hành vi nào được SGK nêu là tội phạm sử dụng công nghệ cao?", "options": {"A": "Học trực tuyến đúng quy định", "B": "Tra cứu tài liệu học tập", "C": "Đánh bạc, tổ chức đánh bạc trên không gian mạng", "D": "Gửi bài tập qua email"}, "answer": "C", "level": "Nhận biết", "page": 20, "reference": "II.2. Một số hành vi phạm tội"}, {"id": 23, "grade": 11, "lesson": 3, "question": "Một người lập trang giả mạo để chiếm đoạt tài sản trên mạng. Tình huống phù hợp nhóm hành vi nào trong SGK?", "options": {"A": "Hoạt động quảng bá hợp pháp", "B": "Lừa đảo chiếm đoạt tài sản trên không gian mạng", "C": "Hoạt động học tập trực tuyến", "D": "Hoạt động giao lưu văn hóa"}, "answer": "B", "level": "Vận dụng", "page": 20, "reference": "II.2. Một số hành vi phạm tội"}, {"id": 24, "grade": 11, "lesson": 3, "question": "Theo SGK, tệ nạn xã hội là hiện tượng xã hội tiêu cực biểu hiện bằng hành vi như thế nào?", "options": {"A": "Sai lệch chuẩn mực xã hội, vi phạm đạo đức, pháp luật và gây nguy hại cho xã hội", "B": "Chấp hành tốt nội quy", "C": "Tuân thủ chuẩn mực đạo đức", "D": "Tham gia hoạt động tình nguyện"}, "answer": "A", "level": "Nhận biết", "page": 21, "reference": "III.1. Khái niệm tệ nạn xã hội"}, {"id": 25, "grade": 11, "lesson": 3, "question": "Nhóm nào sau đây được SGK nêu là các loại tệ nạn xã hội?", "options": {"A": "Ma túy, mại dâm, cờ bạc, mê tín dị đoan", "B": "Du lịch, nghiên cứu, tình nguyện", "C": "Thể thao, văn nghệ, đọc sách", "D": "Học tập, lao động, sáng tạo"}, "answer": "A", "level": "Nhận biết", "page": 21, "reference": "III.2. Một số loại tệ nạn xã hội"}, {"id": 26, "grade": 11, "lesson": 3, "question": "Khi nhận được lời rủ rê tham gia đánh bạc trực tuyến, học sinh nên làm gì theo trách nhiệm nêu trong SGK?", "options": {"A": "Chia sẻ lời mời cho cả lớp", "B": "Không tham gia và vận động người khác không tham gia", "C": "Thử tham gia một lần", "D": "Giữ bí mật và tham gia"}, "answer": "B", "level": "Vận dụng", "page": 23, "reference": "IV.2. Trách nhiệm của học sinh"}, {"id": 27, "grade": 11, "lesson": 7, "question": "Theo SGK, vũ khí quân dụng gồm nhóm nào dưới đây?", "options": {"A": "Súng cầm tay và vũ khí hạng nhẹ", "B": "Chỉ dụng cụ học tập", "C": "Chỉ thiết bị văn phòng", "D": "Chỉ dụng cụ nấu ăn"}, "answer": "A", "level": "Nhận biết", "page": 46, "reference": "I.1.a. Vũ khí"}, {"id": 28, "grade": 11, "lesson": 7, "question": "Theo SGK, vật liệu nổ gồm hai nhóm nào?", "options": {"A": "Thuốc nổ và phụ kiện nổ", "B": "Thuốc chữa bệnh và vật tư y tế", "C": "Nhiên liệu và nước", "D": "Kim loại và nhựa"}, "answer": "A", "level": "Nhận biết", "page": 47, "reference": "I.1.b. Vật liệu nổ"}, {"id": 29, "grade": 11, "lesson": 7, "question": "Theo SGK, còng số 8 thuộc nhóm nào?", "options": {"A": "Công cụ hỗ trợ", "B": "Đồ dùng học tập", "C": "Thiết bị đo lường", "D": "Vật liệu xây dựng"}, "answer": "A", "level": "Nhận biết", "page": 47, "reference": "I.1.c. Công cụ hỗ trợ"}, {"id": 30, "grade": 11, "lesson": 7, "question": "Theo SGK, cá nhân tự ý mua bán trái phép vũ khí thuộc loại hành vi nào?", "options": {"A": "Hành vi bị nghiêm cấm", "B": "Hoạt động giáo dục thể chất", "C": "Hoạt động phổ biến pháp luật", "D": "Hoạt động bảo quản hợp pháp"}, "answer": "A", "level": "Vận dụng", "page": 48, "reference": "I.2. Nội dung quy định pháp luật"}, {"id": 31, "grade": 11, "lesson": 7, "question": "Khi phát hiện người khác tàng trữ trái phép vũ khí, học sinh cần làm gì?", "options": {"A": "Thông báo kịp thời cho thầy cô, nhà trường hoặc cơ quan chức năng", "B": "Giấu thông tin", "C": "Tự ý cầm thử vũ khí", "D": "Đăng lời rao bán giúp người đó"}, "answer": "A", "level": "Vận dụng", "page": 49, "reference": "II.2. Trách nhiệm của học sinh"}, {"id": 32, "grade": 11, "lesson": 1, "question": "Nội dung nào thể hiện mục tiêu bảo vệ Tổ quốc trong SGK?", "options": {"A": "Giữ vững môi trường hòa bình, ổn định chính trị, an ninh quốc gia", "B": "Chỉ phát triển ngành du lịch", "C": "Chỉ bảo vệ các tuyến giao thông", "D": "Chỉ bảo vệ các đô thị"}, "answer": "A", "level": "Vận dụng", "page": 5, "reference": "I.1. Mục tiêu"}, {"id": 33, "grade": 11, "lesson": 1, "question": "Biên giới quốc gia trên đất liền được xác định bằng cách nào?", "options": {"A": "Chỉ dựa vào đường giao thông", "B": "Chỉ dựa vào các biển quảng cáo", "C": "Được hoạch định và đánh dấu trên thực địa bằng hệ thống mốc quốc giới", "D": "Do từng cá nhân tự xác định"}, "answer": "C", "level": "Thông hiểu", "page": 6, "reference": "II.2. Biên giới quốc gia"}, {"id": 34, "grade": 11, "lesson": 1, "question": "Khu vực biên giới trên biển được tính từ đâu?", "options": {"A": "Từ biên giới quốc gia trên đất liền", "B": "Từ mọi con sông nội địa", "C": "Từ ranh giới các tỉnh không giáp biển", "D": "Từ biên giới quốc gia trên biển vào hết địa giới hành chính xã, phường, thị trấn giáp biển"}, "answer": "D", "level": "Thông hiểu", "page": 7, "reference": "II.3. Khu vực biên giới"}, {"id": 35, "grade": 11, "lesson": 1, "question": "Một nhóm định tự ý dịch chuyển mốc quốc giới để mở rộng đường đi. Cách xử lí nào phù hợp với SGK?", "options": {"A": "Coi việc chuyển mốc là hoạt động tự nguyện", "B": "Chỉ chuyển mốc khi có nhiều người đồng ý", "C": "Không thực hiện và báo cơ quan có thẩm quyền", "D": "Tự ý chuyển mốc rồi báo sau"}, "answer": "C", "level": "Vận dụng cao", "page": 7, "reference": "II.4. Các hành vi bị nghiêm cấm"}, {"id": 36, "grade": 11, "lesson": 1, "question": "Theo SGK, vùng biển Việt Nam bao gồm bộ phận nào sau đây?", "options": {"A": "Nội thủy, lãnh hải, vùng tiếp giáp lãnh hải, vùng đặc quyền kinh tế và thềm lục địa", "B": "Chỉ vùng biển quốc tế", "C": "Chỉ vùng biển ven đảo không có đất liền", "D": "Chỉ nội thủy và lãnh hải"}, "answer": "A", "level": "Thông hiểu", "page": 8, "reference": "III.2. Luật Biển Việt Nam"}, {"id": 37, "grade": 11, "lesson": 2, "question": "Theo SGK, nghĩa vụ quân sự bao gồm những hình thức phục vụ nào?", "options": {"A": "Chỉ làm việc tại doanh nghiệp", "B": "Phục vụ tại ngũ và phục vụ trong ngạch dự bị của Quân đội nhân dân", "C": "Chỉ học tập tại trường phổ thôn 00;if(exam)timer=setInterval(()=>{let s=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('status').textContent='Thời gian còn: '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!s)finish()},1000);render()}function sound(ok){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?750:230;o.connect(g);g.connect(a.destination);g.gain.value=.04;o.start();o.stop(a.currentTime+.12)}catch(e){}}function render(){if(idx>=pool.length)return finish();let q=pool[idx],v=answers[q.id];$('status').textContent=(exam?'Thi thử':'Luyện tập')+' – Câu '+(idx+1)+'/'+pool.length;$('quiz').innerHTML='<h3>Câu '+(idx+1)+'. '+escapeHtml(q.question)+'</h3><p class="muted">Bài '+q.lesson+' · '+escapeHtml(q.level)+'</p>'+Object.entries(q.options).map(([k,t])=>'<button class="opt '+(!exam&&v&&k===q.answer?'good':!exam&&v===k&&v!==q.answer?'bad':'')+'" data-key="'+k+'" onclick="choose(this.dataset.key)" '+(!exam&&v?'disabled':'')+'>'+k+'. '+escapeHtml(t)+'</button>').join('')+(!exam&&v?'<p><b>'+(v===q.answer?'Chính xác':'Đáp án đúng: '+q.answer)+'</b></p>':'')+'<div class="toolbar"><button onclick="next()">'+(idx===pool.length-1?'Nộp bài':'Câu tiếp theo')+'</button><button onclick="finish()">Kết thúc</button></div>'}function choose(k){let q=pool[idx];if(!exam&&answers[q.id])return;answers[q.id]=k;if(!exam)sound(k===q.answer);render()}function next(){idx++;render()}function finish(){clearInterval(timer);let correct=0,bad=0,blank=0,w=new Set(wrong());pool.forEach(q=>{let a=answers[q.id];if(!a)blank++;else if(a===q.answer){correct++;w.delete(q.id)}else{bad++;w.add(q.id)}});saveWrong([...w]);$('status').textContent='Đã hoàn thành';$('quiz').innerHTML='<h3>Kết quả</h3><p>Đúng: '+correct+' · Sai: '+bad+' · Chưa làm: '+blank+'</p><p>Điểm: '+(10*correct/pool.length).toFixed(2)+'/10</p><button onclick="start(false)">Làm lượt khác</button>'}function retryWrong(){let ids=new Set(wrong());let a=DATA.filter(q=>ids.has(q.id));if(!a.length){$('quiz').textContent='Chưa có câu sai được lưu.';return}start(false,a)}function showStats(){$('quiz').textContent='Tổng câu hiện có: '+DATA.length+'; số câu sai đã lưu: '+wrong().length+'. Dữ liệu lưu trên trình duyệt này.'}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}for(let x of [...new Set(DATA.map(q=>q.lesson))])$('lesson').insertAdjacentHTML('beforeend','<option value="'+x+'">Bài '+x+'</option>');$('status').textContent='Dữ liệu chỉ gồm các câu đã biên soạn, đủ 50 câu, đang chờ phản biện cuối.';</script></body></html>
